account_file: "account.json" # file chứa thông tin login

# cấu hình login
login_qrcode: true # bật fallback QR khi cookie không hợp lệ hoặc chưa có cookie
qrcode_path: "qr.png" # ảnh qrcode
save_cookie: true # tự động lưu lại cookie sau khi đăng nhập bằng qrcode xong

# cấu hình bot
prefix: "/"
name_bot: "DucMinh"
# sử dụng lệnh /id để lấy id
# chú ý: mỗi acc chạy bot get info sẽ ra 1 id khác nhau nên nếu đổi acc chạy bot phải đổi id (do zalỏ lưu data ở local)
admin_bot:
  - "854029864624201645"
support_bot:
  - "1"
  - "2"
allow_private_command: true # có cho bot nhận lệnh từ tin nhắn riêng hay không
default_money: 0 # tiền mặc định của user khi khởi tạo database

# cấu hình của zca-js
zca_js_config:
  selfListen: false
  checkUpdate: true
  logging: true
